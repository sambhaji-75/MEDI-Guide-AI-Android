plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.mediguide.ai'
    compileSdk 36

    defaultConfig {
        applicationId "com.mediguide.ai"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        buildConfig true
    }

    // Prototype placeholder only. Never put a real production Gemini key here.
    buildTypes {
        debug {
            buildConfigField "String", "GEMINI_API_KEY", "\"REPLACE_WITH_TEST_KEY\""
        }
        release {
            buildConfigField "String", "GEMINI_API_KEY", "\"REPLACE_WITH_BACKEND_PROXY\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-database'

    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'com.google.firebase:firebase-analytics'

}
